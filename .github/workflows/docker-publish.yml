name: Docker Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          # IMAGE_NAME = github.repository → ghcr.io/ulsklyc/yuvomi (primary, post-rename).
          # The second image is a PERMANENT parallel push to the legacy
          # ghcr.io/ulsklyc/oikos package. It must NOT be removed: legacy users run
          # docker-compose/Unraid/TrueNAS configs that still reference the old image
          # name, and the app self-migrates the database on boot — so an unchanged
          # legacy config keeps receiving updates indefinitely without any manual edit.
          # Dropping this mirror would break `docker pull ghcr.io/ulsklyc/oikos` and
          # force every legacy user to hand-edit their config. Keep it.
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/oikos
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

  deploy:
    name: Deploy to Production
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: self-hosted

    steps:
      - name: Wait for CI to pass on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Polls rather than doing a single point-in-time read: on a tag push,
          # this deploy job can start racing the ci.yml run for the same
          # commit, so a one-shot check can observe "no run yet" or
          # "in_progress" and fail a commit whose CI hasn't had a chance to
          # finish. An empty workflow_runs array (run not registered yet) and
          # a null/missing conclusion (run registered but not concluded) are
          # both treated as "pending" and retried; only a definitive terminal
          # conclusion other than success (failure, cancelled, timed_out,
          # etc.) fails immediately.
          DEADLINE=$((SECONDS + 300))
          while true; do
            conclusion=$(curl -sS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ github.sha }}&per_page=1" \
              | python3 -c "import json,sys; runs=json.load(sys.stdin).get('workflow_runs', []); print((runs[0].get('conclusion') or 'pending') if runs else 'pending')")
            echo "CI conclusion for ${{ github.sha }}: $conclusion"

            if [ "$conclusion" = "success" ]; then
              break
            fi

            if [ "$conclusion" != "pending" ]; then
              echo "::error::CI did not succeed for this commit (conclusion: $conclusion) — refusing to deploy."
              exit 1
            fi

            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "::error::Timed out after 5m waiting for CI to conclude for this commit — refusing to deploy."
              exit 1
            fi

            sleep 15
          done

      - name: Deploy over SSH
        run: |
          set -euo pipefail
          trap 'rm -f ~/.ssh/yuvomi_deploy_key' EXIT
          # github.ref_name for a tag push is the tag itself, e.g. "v1.20.2".
          # Strip the leading "v" to match the image tag docker/metadata-action
          # produced (its type=semver pattern does the same stripping).
          IMAGE_TAG="${GITHUB_REF_NAME#v}"
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.YUVOMI_DEPLOY_SSH_KEY }}" > ~/.ssh/yuvomi_deploy_key
          chmod 600 ~/.ssh/yuvomi_deploy_key
          ssh -i ~/.ssh/yuvomi_deploy_key -o StrictHostKeyChecking=accept-new \
            root@192.168.178.95 "$IMAGE_TAG"
